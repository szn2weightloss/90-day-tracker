<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="90 Day Tracker">
  <title>90 Day Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>90 Day Tracker</h1>
    <p id="dayLabel">Day 1 of 90</p>
  </div>
  <button id="todayBtn">Today</button>
</header>

<main>

  <section class="date-card">
    <button id="prevDay">‹</button>

    <div class="date-center">
      <div id="dateLabel"></div>
      <div class="target-label">
        Calorie target
      </div>
      <div class="calorie-target">
        <span id="targetCalories">900</span>
        <span>cal</span>
      </div>
    </div>

    <button id="nextDay">›</button>
  </section>

  <section class="stats-grid">

    <div class="stat-card">
      <span>Calories</span>
      <strong id="caloriesTotal">0</strong>
      <small>/ <span id="caloriesGoal">900</span></small>
    </div>

    <div class="stat-card">
      <span>Protein</span>
      <strong id="proteinTotal">0</strong>
      <small>g</small>
    </div>

    <div class="stat-card">
      <span>Fiber</span>
      <strong id="fiberTotal">0</strong>
      <small>g</small>
    </div>

    <div class="stat-card">
      <span>Water</span>
      <strong id="waterTotal">0</strong>
      <small>/ 80 oz</small>
    </div>

  </section>

  <section class="progress-card">
    <div class="progress-header">
      <span>Daily calories</span>
      <span id="remainingCalories">900 remaining</span>
    </div>

    <div class="progress-bar">
      <div id="calorieProgress"></div>
    </div>
  </section>

  <section class="section">

    <div class="section-title">
      <h2>Food</h2>
      <button class="primary-btn" id="addFoodBtn">+ Add Food</button>
    </div>

    <div id="foodList" class="food-list">
      <p class="empty">No food logged yet.</p>
    </div>

  </section>

  <section class="section">

    <h2>Daily tracking</h2>

    <div class="input-grid">

      <label>
        Water (oz)
        <input type="number" id="waterInput" placeholder="80">
      </label>

      <label>
        Steps
        <input type="number" id="stepsInput" placeholder="10000">
      </label>

      <label>
        Weight (lb)
        <input type="number" step="0.1" id="weightInput" placeholder="227">
      </label>

      <label>
        Workout minutes
        <input type="number" id="workoutInput" placeholder="30">
      </label>

    </div>

    <label class="full-input">
      Workout
      <select id="workoutSelect">
        <option value="">None</option>
        <option>Pilates</option>
        <option>Barre</option>
        <option>Walking</option>
        <option>13-3-30</option>
        <option>Strength training</option>
        <option>Other</option>
      </select>
    </label>

    <label class="full-input">
      Fasting window
      <input type="text" id="fastingInput" placeholder="Example: 8 PM – 10 AM">
    </label>

    <label class="full-input">
      Notes
      <textarea id="notesInput" placeholder="How did today go?"></textarea>
    </label>

  </section>

  <section class="section">

    <div class="section-title">
      <h2>90-day progress</h2>
      <span id="completedLabel">0 / 90 days</span>
    </div>

    <div class="overall-progress">
      <div id="overallProgress"></div>
    </div>

  </section>

</main>

<!-- FOOD MODAL -->

<div id="foodModal" class="modal hidden">

  <div class="modal-content">

    <div class="modal-header">
      <h2>Add Food</h2>
      <button id="closeFoodModal">×</button>
    </div>

    <input
      type="search"
      id="foodSearch"
      placeholder="Search food..."
      autocomplete="off"
    >

    <div id="foodResults" class="food-results"></div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
